<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Python CHaser</title>
    <link rel="icon" href="./images/favicon.ico">
    <!-- Google FontsからIBM Plex Sans JPとIBM Plex Monoを読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    <!-- CodeMirrorのCSSを読み込み -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
    <!-- CodeMirrorのテーマを読み込み -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/monokai.min.css">
    <!-- Pyodideを読み込み -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
    <style>
        /* 全体のスタイル */
        body {
            margin: 0;
            font-family: 'IBM Plex Sans JP', sans-serif;
            background-color: #1e1e1e;
            color: #ccc;
            scrollbar-width: thin;
            scrollbar-color: #555 #2d2d2d;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダーのスタイル */
        .header {
            background-color: #333;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            color: #fff;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        /* メインコンテナ */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左側の列（エディタとコンソール） */
        .left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #444;
            overflow: hidden;
        }

        /* エディタタブ */
        .editor-tabs {
            display: flex;
            background-color: #2d2d2d;
            border-bottom: 1px solid #444;
        }

        .tab-button {
            background-color: #2d2d2d;
            color: #aaa;
            border: none;
            border-right: 1px solid #444;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'IBM Plex Sans JP', sans-serif;
        }

        .tab-button:hover {
            background-color: #3c3c3c;
        }

        .tab-button.active {
            background-color: #1e1e1e;
            color: #fff;
            font-weight: 600;
        }

        /* エディタ部分 */
        .editor-pane {
            flex-grow: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }

        .editor-pane.hidden {
            display: none;
        }

        /* マップタブの説明バー */
        .map-tab-hint {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 8px 10px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #444;
            color: #aaa;
            font-size: 12px;
        }

        .map-tab-hint button {
            flex-shrink: 0;
            background-color: #3c3c3c;
            color: #fff;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'IBM Plex Sans JP', sans-serif;
            font-size: 12px;
        }

        .map-tab-hint button:hover {
            background-color: #555;
        }

        .map-use-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ccc;
            cursor: pointer;
        }

        /* マップエディタのツールバー */
        .map-editor-toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            padding: 8px 10px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #444;
            color: #ccc;
            font-size: 12px;
        }

        .map-editor-toolbar label {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .map-editor-toolbar input[type="number"] {
            width: 55px;
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 2px 4px;
        }

        .map-editor-toolbar button {
            background-color: #3c3c3c;
            color: #fff;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'IBM Plex Sans JP', sans-serif;
            font-size: 12px;
        }

        .map-editor-toolbar button:hover {
            background-color: #555;
        }

        .map-tool-group {
            display: flex;
            gap: 4px;
        }

        .map-tool-button.active {
            background-color: #2196f3;
        }

        /* マップグリッドエディタ */
        #map-editor-grid-wrap {
            flex-grow: 1;
            overflow: auto;
            padding: 10px;
            background-color: #1e1e1e;
        }

        #map-editor-grid {
            display: grid;
            gap: 1px;
            width: max-content;
        }

        .map-edit-cell {
            width: 20px;
            height: 20px;
            background-color: #333;
            cursor: pointer;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .map-edit-cell:hover {
            outline: 2px solid #2196f3;
            outline-offset: -2px;
        }

        /* ボタン群 */
        .button-group {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #2d2d2d;
            border-top: 1px solid #444;
        }

        .button-group .active-editor-label {
            margin-left: auto;
            color: #999;
            font-size: 13px;
        }

        .button-group button {
            background-color: #3c3c3c;
            color: #fff;
            border: none;
            padding: 8px 16px;
            margin-right: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'IBM Plex Sans JP', sans-serif;
        }

        .button-group button:hover {
            background-color: #555;
        }

        /* コンソール出力 */
        #console-output {
            background-color: #1e1e1e;
            color: #fff;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            font-family: monospace;
            border-top: 1px solid #444;
            scrollbar-width: thin;
            scrollbar-color: #555 #2d2d2d;
        }

        /* 右側の列（ゲーム画面） */
        .right-column {
            flex: 0 0 40%;
            background-color: #252526;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #555 #2d2d2d;
        }

        /* ゲーム情報 */
        #game-info {
            margin-bottom: 20px;
        }

        #game-info h2 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 10px;
        }

        /* ゲームグリッド */
        #game-grid {
            display: grid;
            grid-template-columns: repeat(17, 30px);
            grid-template-rows: repeat(19, 30px);
            gap: 1px;
            overflow: auto;
            scrollbar-width: thin;
            scrollbar-color: #555 #2d2d2d;
        }

        /* セルのサイズを変更 */
        .cell {
            width: 29px;
            height: 29px;
            background-color: #333;
        }

        .floor, .legend-cell.floor {
            background-color: #8fff8f;
            background-image: url(./images/field.png);
            background-size: cover;
        }

        .block, .legend-cell.block {
            background-color: #777;
            background-image: url(./images/wall.png);
            background-size: cover;
        }

        .item, .legend-cell.item {
            background-color: #f8f840;
            background-image: url(./images/hart.png);
            background-size: cover;
        }

        .player0, .legend-cell.player0 {
            background-color: #2196f3;
            background-image: url(./images/cool.png);
            background-size: cover;
        }

        .player1, .legend-cell.player1 {
            background-color: #e91e63;
            background-image: url(./images/hot.png);
            background-size: cover;
        }

        /* 隠しファイル入力 */
        #file-input {
            display: none;
        }

        /* CodeMirrorのスタイル調整 */
        .CodeMirror {
            height: 100%;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 16px;
            font-family: 'IBM Plex Mono', monospace;
            scrollbar-width: thin;
            scrollbar-color: #555 #2d2d2d;
        }

        /* WebKitベースのブラウザ用スクロールバーのカスタマイズ */
        body::-webkit-scrollbar,
        .CodeMirror::-webkit-scrollbar,
        .left-column::-webkit-scrollbar,
        .right-column::-webkit-scrollbar,
        #console-output::-webkit-scrollbar,
        #game-grid::-webkit-scrollbar {
            width: 12px;
        }

        body::-webkit-scrollbar-track,
        .CodeMirror::-webkit-scrollbar-track,
        .left-column::-webkit-scrollbar-track,
        .right-column::-webkit-scrollbar-track,
        #console-output::-webkit-scrollbar-track,
        #game-grid::-webkit-scrollbar-track {
            background: #2d2d2d;
        }

        body::-webkit-scrollbar-thumb,
        .CodeMirror::-webkit-scrollbar-thumb,
        .left-column::-webkit-scrollbar-thumb,
        .right-column::-webkit-scrollbar-thumb,
        #console-output::-webkit-scrollbar-thumb,
        #game-grid::-webkit-scrollbar-thumb {
            background-color: #555;
            border-radius: 6px;
            border: 3px solid #2d2d2d;
        }

        /* 全角スペースを可視化するスタイル */
        .cm-full-width-space {
            background-color: rgba(255, 0, 0, 0.3);
        }

        /* 不可視文字（スペース）を可視化するスタイル */
        .cm-whitespace-space::before {
            content: '·';
            color: rgba(128, 128, 128, 0.7);
            position: absolute;
        }

        /* インデントガイド用のスタイル */
        .CodeMirror-code .CodeMirror-line::before {
            content: '';
            position: absolute;
            border-left: 1px solid rgba(128, 128, 128, 0.3);
            height: 100%;
            pointer-events: none;
        }

        /* インデントレベルに応じて左位置を調整 */
        .CodeMirror-code .CodeMirror-line {
            position: relative;
        }

        /* インデントレベルのクラスを定義 */
        .CodeMirror-code .CodeMirror-line.indent-level-1::before { left: 4ch; }
        .CodeMirror-code .CodeMirror-line.indent-level-2::before { left: 8ch; }
        .CodeMirror-code .CodeMirror-line.indent-level-3::before { left: 12ch; }
        .CodeMirror-code .CodeMirror-line.indent-level-4::before { left: 16ch; }
        .CodeMirror-code .CodeMirror-line.indent-level-5::before { left: 20ch; }

        /* 凡例のスタイル */
        #legend {
            margin-top: 20px;
        }

        #legend h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 10px;
        }

        #legend ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #legend li {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .legend-cell {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

    </style>
</head>
<body>
    <div class="header">
        <h1>Python CHaser Web</h1>
    </div>
    <div class="container">
        <!-- 左側の列（エディタとコンソール） -->
        <div class="left-column">
            <div class="editor-tabs">
                <button id="tab-player" class="tab-button active">プレイヤー</button>
                <button id="tab-opponent" class="tab-button">対戦AI</button>
                <button id="tab-map" class="tab-button">マップ</button>
            </div>
            <div id="editor-player" class="editor-pane">
                <textarea id="editor"></textarea>
            </div>
            <div id="editor-opponent" class="editor-pane hidden">
                <textarea id="editor-opponent-textarea"></textarea>
            </div>
            <div id="editor-map" class="editor-pane hidden">
                <div class="map-tab-hint">
                    <label class="map-use-toggle">
                        <input type="checkbox" id="map-use-custom">
                        このマップを対戦で使用する（オフの場合は毎回ランダム生成）
                    </label>
                    <button id="generate-random-map-button" type="button">ランダムマップを生成</button>
                    <button id="clear-map-button" type="button">クリア</button>
                </div>
                <div class="map-editor-toolbar">
                    <label>幅<input type="number" id="map-size-x" min="5" max="40" value="15"></label>
                    <label>高さ<input type="number" id="map-size-y" min="5" max="40" value="17"></label>
                    <button id="map-resize-button" type="button">サイズ変更</button>
                    <label>ターン数<input type="number" id="map-turn-max" min="1" max="999" value="150"></label>
                    <div class="map-tool-group" id="map-tool-group">
                        <button class="map-tool-button active" data-tool="floor" type="button">床</button>
                        <button class="map-tool-button" data-tool="block" type="button">ブロック</button>
                        <button class="map-tool-button" data-tool="item" type="button">アイテム</button>
                        <button class="map-tool-button" data-tool="cool" type="button">プレイヤ(Cool)</button>
                        <button class="map-tool-button" data-tool="hot" type="button">対戦AI(Hot)</button>
                    </div>
                </div>
                <div id="map-editor-grid-wrap">
                    <div id="map-editor-grid"></div>
                </div>
            </div>
            <div class="button-group">
                <button id="run-button">実行</button>
                <button id="download-button">ダウンロード</button>
                <button id="upload-button">アップロード</button>
                <!-- ファイル入力要素（非表示） -->
                <input type="file" id="file-input" accept=".py">
                <span class="active-editor-label" id="active-editor-label">編集中: プレイヤー</span>
            </div>
            <div id="console-output"></div>
        </div>
        <!-- 右側の列（ゲーム画面） -->
        <div class="right-column">
            <div id="game-info">
                <h2>ゲーム情報</h2>
                <p id="turn-number">Turn: 150</p>
                <p id="player-scores">Scores プレイヤ: 0 -+- 0 : 対戦AI</p>
                <div id="game-display">
                    <h2>ゲーム画面</h2>
                    <div id="game-grid"></div>
                    <!-- 凡例を追加 -->
                    <div id="legend">
                        <h3>マス種類</h3>
                        <ul>
                            <li><span class="legend-cell player0"></span> プレイヤ(Cool)</li>
                            <li><span class="legend-cell player1"></span> 対戦AI(Hot)</li>
                            <!-- <li><span class="legend-cell floor"></span> 床</li> -->
                            <li><span class="legend-cell block"></span> ブロック</li>
                            <li><span class="legend-cell item"></span> アイテム</li>
                        </ul>
                    </div>
                </div>
        </div>
    </div>

    <!-- CodeMirrorのJSを読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <!-- CodeMirrorのPythonモードを読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <!-- CodeMirrorのキー設定（任意） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/keymap/sublime.min.js"></script>
    <!-- CodeMirrorのアドオン（任意） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>

    <script>
        // CodeMirrorエディタの初期化（プレイヤー用・対戦AI用の2つ。マップはグリッドエディタ）
        var codeMirrorOptions = {
            mode: 'python',
            lineNumbers: true,
            indentUnit: 4,
            theme: 'monokai',
            autoCloseBrackets: true,
            matchBrackets: true,
            tabSize: 4,
            indentWithTabs: false,
            extraKeys: {
                Tab: function(cm) {
                    var spaces = Array(cm.getOption("indentUnit") + 1).join(" ");
                    cm.replaceSelection(spaces);
                }
            },
        };
        var playerEditor = CodeMirror.fromTextArea(document.getElementById('editor'), codeMirrorOptions);
        var opponentEditor = CodeMirror.fromTextArea(document.getElementById('editor-opponent-textarea'), codeMirrorOptions);

        // ---- マップのビジュアル（グリッド）エディタ ----
        // セルの値: 0=床, 2=ブロック, 3=アイテム。Cool/Hotの初期位置は別管理（セル値とは独立）。
        var MAP_TOOL_CELL_VALUE = { floor: 0, block: 2, item: 3 };
        var mapTool = 'floor';
        var mapGrid = null;

        function createEmptyMapGrid(sizeX, sizeY, turnMax) {
            var cells = [];
            for (var y = 0; y < sizeY; y++) {
                cells.push(new Array(sizeX).fill(0));
            }
            return { sizeX: sizeX, sizeY: sizeY, turnMax: turnMax, cells: cells, coolPos: null, hotPos: null };
        }

        // グリッド状態 → N:/T:/S:/D:/H:/C: 形式のマップデータ文字列
        function serializeMapToText() {
            var lines = [];
            lines.push('N:CustomMap');
            lines.push('T:' + mapGrid.turnMax);
            lines.push('S:' + mapGrid.sizeX + ',' + mapGrid.sizeY);
            for (var y = 0; y < mapGrid.sizeY; y++) {
                lines.push('D:' + mapGrid.cells[y].join(','));
            }
            if (mapGrid.coolPos) lines.push('C:' + mapGrid.coolPos.x + ',' + mapGrid.coolPos.y);
            if (mapGrid.hotPos) lines.push('H:' + mapGrid.hotPos.x + ',' + mapGrid.hotPos.y);
            return lines.join('\n');
        }

        // マップデータ文字列 → グリッド状態（アップロードやランダム生成結果の取り込みに使用）
        function parseMapText(text) {
            var sizeX = 15, sizeY = 17, turnMax = 150;
            var rows = [];
            var coolPos = null, hotPos = null;
            (text || '').split(/\r?\n/).forEach(function(rawLine) {
                var line = rawLine.trim();
                if (line.length < 2 || line[1] !== ':') return;
                var prefix = line[0];
                var body = line.slice(2);
                if (prefix === 'T') {
                    var t = parseInt(body, 10);
                    if (!isNaN(t)) turnMax = t;
                } else if (prefix === 'S') {
                    var s = body.split(',').map(Number);
                    if (s.length === 2 && s.every(function(n) { return !isNaN(n); })) {
                        sizeX = s[0]; sizeY = s[1];
                    }
                } else if (prefix === 'D') {
                    rows.push(body.split(',').map(Number));
                } else if (prefix === 'C') {
                    var c = body.split(',').map(Number);
                    if (c.length === 2) coolPos = { x: c[0], y: c[1] };
                } else if (prefix === 'H') {
                    var h = body.split(',').map(Number);
                    if (h.length === 2) {
                        // C:が無いままH:が2回現れる互換形式（旧ランダム生成など）は、
                        // 1つ目をCoolの初期位置として扱う
                        if (!coolPos) {
                            coolPos = { x: h[0], y: h[1] };
                        } else {
                            hotPos = { x: h[0], y: h[1] };
                        }
                    }
                }
            });
            var cells = [];
            for (var y = 0; y < sizeY; y++) {
                var srcRow = rows[y] || [];
                var row = [];
                for (var x = 0; x < sizeX; x++) {
                    row.push(srcRow[x] !== undefined && !isNaN(srcRow[x]) ? srcRow[x] : 0);
                }
                cells.push(row);
            }
            mapGrid = { sizeX: sizeX, sizeY: sizeY, turnMax: turnMax, cells: cells, coolPos: coolPos, hotPos: hotPos };
            document.getElementById('map-size-x').value = sizeX;
            document.getElementById('map-size-y').value = sizeY;
            document.getElementById('map-turn-max').value = turnMax;
        }

        function renderMapGrid() {
            var container = document.getElementById('map-editor-grid');
            container.style.gridTemplateColumns = 'repeat(' + mapGrid.sizeX + ', 20px)';
            container.style.gridTemplateRows = 'repeat(' + mapGrid.sizeY + ', 20px)';
            container.innerHTML = '';
            var CELL_CLASS_BY_VALUE = { 0: 'floor', 2: 'block', 3: 'item' };
            for (var y = 0; y < mapGrid.sizeY; y++) {
                for (var x = 0; x < mapGrid.sizeX; x++) {
                    var cell = document.createElement('div');
                    cell.className = 'map-edit-cell ' + (CELL_CLASS_BY_VALUE[mapGrid.cells[y][x]] || 'floor');
                    if (mapGrid.coolPos && mapGrid.coolPos.x === x && mapGrid.coolPos.y === y) {
                        cell.className += ' player0';
                    }
                    if (mapGrid.hotPos && mapGrid.hotPos.x === x && mapGrid.hotPos.y === y) {
                        cell.className += ' player1';
                    }
                    cell.title = '(' + x + ', ' + y + ')';
                    cell.addEventListener('click', (function(cx, cy) {
                        return function() { applyMapTool(cx, cy); };
                    })(x, y));
                    container.appendChild(cell);
                }
            }
        }

        function applyMapTool(x, y) {
            if (mapTool === 'cool') {
                mapGrid.coolPos = { x: x, y: y };
            } else if (mapTool === 'hot') {
                mapGrid.hotPos = { x: x, y: y };
            } else {
                mapGrid.cells[y][x] = MAP_TOOL_CELL_VALUE[mapTool];
            }
            renderMapGrid();
        }

        document.querySelectorAll('.map-tool-button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                mapTool = btn.getAttribute('data-tool');
                document.querySelectorAll('.map-tool-button').forEach(function(b) {
                    b.classList.toggle('active', b === btn);
                });
            });
        });

        document.getElementById('map-resize-button').addEventListener('click', function() {
            var newX = Math.max(5, Math.min(40, parseInt(document.getElementById('map-size-x').value, 10) || mapGrid.sizeX));
            var newY = Math.max(5, Math.min(40, parseInt(document.getElementById('map-size-y').value, 10) || mapGrid.sizeY));
            var newCells = [];
            for (var y = 0; y < newY; y++) {
                var row = [];
                for (var x = 0; x < newX; x++) {
                    row.push((mapGrid.cells[y] && mapGrid.cells[y][x] !== undefined) ? mapGrid.cells[y][x] : 0);
                }
                newCells.push(row);
            }
            mapGrid.cells = newCells;
            mapGrid.sizeX = newX;
            mapGrid.sizeY = newY;
            if (mapGrid.coolPos && (mapGrid.coolPos.x >= newX || mapGrid.coolPos.y >= newY)) mapGrid.coolPos = null;
            if (mapGrid.hotPos && (mapGrid.hotPos.x >= newX || mapGrid.hotPos.y >= newY)) mapGrid.hotPos = null;
            document.getElementById('map-size-x').value = newX;
            document.getElementById('map-size-y').value = newY;
            renderMapGrid();
        });

        document.getElementById('map-turn-max').addEventListener('change', function() {
            var t = parseInt(this.value, 10);
            mapGrid.turnMax = (!isNaN(t) && t > 0) ? t : mapGrid.turnMax;

    transformed_code = ast.unparse(new_tree)

                    pyodide.FS.writeFile('lib/pyCHaser.py', chaserCode);

                    // 前回の対戦で読み込まれたlib.pyCHaserのキャッシュを破棄し、
                    // 共有ゲームインスタンス(_shared_game)を含めて完全にリセットする
                    await pyodide.runPythonAsync(`
import sys
sys.modules.pop('lib.pyCHaser', None)
sys.modules.pop('lib', None)
                    `);

                    // プレイヤー・対戦AIそれぞれのコードを変換
                    pyodide.globals.set('player_code', playerCode);
                    pyodide.globals.set('opponent_code', opponentCode);
                    await pyodide.runPythonAsync(`
player_transformed = transform_code(player_code, player_id=0, client_name='player')
opponent_transformed = transform_code(opponent_code, player_id=1, client_name='opponent')
                    `);
                    // 変換後のコードをコンソールに出力（デバッグ用）
                    console.log("Transformed Player Code:\\n", pyodide.globals.get('player_transformed'));
                    console.log("Transformed Opponent Code:\\n", pyodide.globals.get('opponent_transformed'));

                    // プレイヤー・対戦AIをそれぞれ独立した名前空間で実行する。
                    // 両者とも自身の`from lib.pyCHaser import *`によって同じlib.pyCHaserモジュール
                    // （＝同じ共有ゲームインスタンス）を参照するため、この2つのClientは
                    // 同一の対戦に参加することになる。
                    pyodide.globals.set('map_data', mapData || null);
                    await pyodide.runPythonAsync(`
player_ns = {'__name__': '__chaser_player__'}
opponent_ns = {'__name__': '__chaser_opponent__'}

# 名前空間内でexecすると"from lib.pyCHaser import *"によりlib.pyCHaserがインポートされる
# （Gameインスタンスはまだ生成されない。main()を呼び出した時点で生成される）
exec(player_transformed, player_ns)
exec(opponent_transformed, opponent_ns)

# 対戦の終了判定・マップ設定に使うため、共有モジュールを取得しておく
import lib.pyCHaser as _chaser_mod
# アップロードされたマップ（空ならNone＝ランダム生成）をGame生成前に設定する
_chaser_mod.set_custom_map(map_data)

do_turn_player = player_ns['main']()
do_turn_opponent = opponent_ns['main']()
                    `);

                    // ゲーム実行フラグを設定
                    gameRunning = true;
                    runTurn();
                } catch (err) {
                    // エラーメッセージを表示
                    writeToConsole(err.message || err);
                }
            }

            function runTurn() {
                if (!gameRunning) return;

                let doTurnOpponent = pyodide.globals.get('do_turn_opponent');
                let doTurnPlayer = pyodide.globals.get('do_turn_player');
                try {
                    // 対戦AI → プレイヤーの順に1ターン分の行動を行う
                    let continueOpponent = doTurnOpponent();
                    let continuePlayer = doTurnPlayer();
                    let isOver = pyodide.runPython('_chaser_mod.get_shared_game().is_game_over()');

                    if (continueOpponent && continuePlayer && !isOver) {
                        // ゲームが続行中の場合、次のターンを実行
                        turnTimeout = setTimeout(runTurn, 500);
                    } else {
                        // ゲーム終了
                        gameRunning = false;
                        console.log('ゲームが終了しました');
                    }
                } catch (err) {
                    // エラーメッセージを表示
                    writeToConsole(err.message || err);
                    gameRunning = false;
                    console.log('ゲームが終了しました');
                }
            }

            // ダウンロードボタンのクリックイベントを追加（現在選択中のタブのエディタが対象）
            var DEFAULT_DOWNLOAD_NAME = { player: 'my_program', opponent: 'my_opponent', map: 'my_map' };
            var DOWNLOAD_EXTENSION = { player: '.py', opponent: '.py', map: '.txt' };
            document.getElementById('download-button').addEventListener('click', () => {
                let code = getActiveEditor().getValue();
                let defaultName = DEFAULT_DOWNLOAD_NAME[activeEditorKey];
                let filename = prompt('ファイル名を入力してください（拡張子は不要です）:', defaultName);
                if (filename !== null) {
                    filename = filename.trim();
                    if (filename === '') {
                        alert('ファイル名が空です。');
                        return;
                    }
                    // ファイル名に拡張子を追加
                    let fullFilename = filename + DOWNLOAD_EXTENSION[activeEditorKey];
                    // ファイルを作成してダウンロード
                    let blob = new Blob([code], { type: 'text/plain' });
                    let url = URL.createObjectURL(blob);
                    let a = document.createElement('a');
                    a.href = url;
                    a.download = fullFilename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
            });

            // アップロードボタンのクリックイベントを追加（現在選択中のタブのエディタに読み込む）
            document.getElementById('upload-button').addEventListener('click', () => {
                // ファイル選択ダイアログを表示
                document.getElementById('file-input').click();
            });

            // ファイルが選択されたときの処理
            document.getElementById('file-input').addEventListener('change', (event) => {
                let file = event.target.files[0];
                if (file) {
                    let reader = new FileReader();
                    reader.onload = function(e) {
                        let content = e.target.result;
                        getActiveEditor().setValue(replaceTabsWithSpaces(content));
                    };
                    reader.readAsText(file);
                    // 同じファイルを続けて選択できるよう入力値をリセット
                    event.target.value = '';
                }
            });

            // 全角スペースを検出してハイライトするオーバーレイを定義
            var fullWidthSpaceOverlay = {
                token: function(stream) {
                    if (stream.peek() === '\u3000') {
                        stream.next();
                        return 'full-width-space';
                    }
                    while (!stream.eol() && stream.peek() !== '\u3000') {
                        stream.next();
                    }
                    return null;
                }
            };

            // 不可視文字（スペース）を検出して可視化するオーバーレイを定義
            var invisiblesOverlay = {
                token: function(stream) {
                    if (stream.peek() === ' ') {
                        stream.next();
                        return 'whitespace-space';
                    } else {
                        stream.next();
                        return null;
                    }
                }
            };

            // 各行のインデントレベルを計算してクラスを追加するハンドラ
            function renderLineIndentGuides(cm, line, element) {
                var text = line.text;
                var indentUnit = cm.getOption('indentUnit');
                var indentLevel = 0;
                var spaces = 0;

                for (var i = 0; i < text.length; i++) {
                    if (text[i] === ' ') {
                        spaces++;
                    } else {
                        break;
                    }
                }

                indentLevel = Math.floor(spaces / indentUnit);
                if (indentLevel > 0) {
                    element.classList.add('indent-level-' + indentLevel);
                }
            }

            // プレイヤー・対戦AI両方のエディタにオーバーレイやハンドラを適用
            [playerEditor, opponentEditor].forEach(function(cm) {
                cm.addOverlay(fullWidthSpaceOverlay);
                cm.addOverlay(invisiblesOverlay);
                cm.on('renderLine', renderLineIndentGuides);
                cm.refresh(); // レンダリングを再実行
            });
        }

        main();
    </script>
</body>
</html>
